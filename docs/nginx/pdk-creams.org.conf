##
## Nginx config — pdk-creams.org (Production)
## Architecture: clean direct routes, no /creams/{demo_id}/ prefix
## Created: 14 May 2026
##

server {
    listen 80;
    listen [::]:80;
    server_name pdk-creams.org www.pdk-creams.org;

    root /var/www/creams/public;
    index index.php;

    # Charset
    charset utf-8;

    # ------------------------------------------------------------------
    # SECURITY HEADERS
    # ------------------------------------------------------------------
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ------------------------------------------------------------------
    # LOGGING
    # ------------------------------------------------------------------
    access_log /var/log/nginx/pdk-creams.access.log;
    error_log  /var/log/nginx/pdk-creams.error.log;

    # ------------------------------------------------------------------
    # STATIC ASSETS — serve real files directly, fast
    # Must come BEFORE the catch-all location / block
    # ------------------------------------------------------------------

    # CSS, JS, images, fonts, icons — long cache, immutable
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|webp|woff|woff2|ttf|eot|otf|map)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Laravel storage symlink (/storage → public/storage)
    location /storage {
        try_files $uri =404;
    }

    # PDF downloads served directly
    location ~* \.pdf$ {
        try_files $uri =404;
        add_header Content-Disposition "attachment";
    }

    # ------------------------------------------------------------------
    # KEY FIX: /assets/* — do NOT serve public/assets/ as a directory
    # try_files checks for the exact FILE only ($uri, not $uri/).
    # If no file match → Laravel handles it → /assets route → asset module.
    # This prevents Nginx from returning 403 on the public/assets/ directory.
    # ------------------------------------------------------------------
    location ^~ /assets {
        try_files $uri /index.php?$query_string;
    }

    # ------------------------------------------------------------------
    # ALL OTHER REQUESTS — route to Laravel (no $uri/ directory check)
    # Omitting $uri/ is intentional: Laravel handles all URL routing.
    # ------------------------------------------------------------------
    location / {
        try_files $uri /index.php?$query_string;
    }

    # ------------------------------------------------------------------
    # PHP-FPM
    # ------------------------------------------------------------------
    location ~ \.php$ {
        fastcgi_pass unix:/run/php-fpm/www.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 120;
        fastcgi_buffer_size 16k;
        fastcgi_buffers 4 16k;
    }

    # ------------------------------------------------------------------
    # SECURITY — block dot-files and sensitive paths
    # ------------------------------------------------------------------
    location ~ /\.(?!well-known).* {
        deny all;
    }

    location ~* \.(env|log|sh|sql|conf|json|lock)$ {
        deny all;
        return 404;
    }

    # ------------------------------------------------------------------
    # MAX UPLOAD SIZE (for asset images, letter headers, avatars)
    # ------------------------------------------------------------------
    client_max_body_size 10M;
}

# www redirect (HTTP)
server {
    listen 80;
    listen [::]:80;
    server_name www.pdk-creams.org;
    return 301 http://pdk-creams.org$request_uri;
}

# NOTE: After running Certbot, the above server blocks will be modified
# automatically to add SSL configuration. Certbot command:
#   sudo certbot --nginx -d pdk-creams.org -d www.pdk-creams.org
