##
## Nginx config — creams.faisalhanafi.com (Dev / Staging)
## Architecture: identical to pdk-creams.org — clean direct routes
## Created: 14 May 2026
##

server {
    listen 80;
    listen [::]:80;
    server_name creams.faisalhanafi.com;

    root /var/www/creams/public;
    index index.php;

    charset utf-8;

    # ------------------------------------------------------------------
    # SECURITY HEADERS
    # ------------------------------------------------------------------
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ------------------------------------------------------------------
    # LOGGING
    # ------------------------------------------------------------------
    access_log /var/log/nginx/creams-dev.access.log;
    error_log  /var/log/nginx/creams-dev.error.log;

    # ------------------------------------------------------------------
    # STATIC ASSETS — serve real files directly
    # ------------------------------------------------------------------
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|webp|woff|woff2|ttf|eot|otf|map)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /storage {
        try_files $uri =404;
    }

    location ~* \.pdf$ {
        try_files $uri =404;
        add_header Content-Disposition "attachment";
    }

    # ------------------------------------------------------------------
    # KEY FIX: /assets/* — do NOT serve public/assets/ as a directory
    # ------------------------------------------------------------------
    location ^~ /assets {
        try_files $uri /index.php?$query_string;
    }

    # ------------------------------------------------------------------
    # ALL OTHER REQUESTS — route to Laravel
    # ------------------------------------------------------------------
    location / {
        try_files $uri /index.php?$query_string;
    }

    # ------------------------------------------------------------------
    # PHP-FPM
    # ------------------------------------------------------------------
    location ~ \.php$ {
        fastcgi_pass unix:/run/php-fpm/www.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 120;
        fastcgi_buffer_size 16k;
        fastcgi_buffers 4 16k;
    }

    # ------------------------------------------------------------------
    # SECURITY — block dot-files and sensitive paths
    # ------------------------------------------------------------------
    location ~ /\.(?!well-known).* {
        deny all;
    }

    location ~* \.(env|log|sh|sql|conf|json|lock)$ {
        deny all;
        return 404;
    }

    client_max_body_size 10M;
}

# NOTE: After running Certbot, the server block will be modified
# automatically to add SSL configuration. Certbot command:
#   sudo certbot --nginx -d creams.faisalhanafi.com
