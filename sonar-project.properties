# CREAMS Rehabilitation Management System - SonarScanner Configuration

# Project Identification
sonar.projectKey=creams-rehabilitation-system
sonar.projectName=CREAMS Rehabilitation Management System
sonar.projectVersion=1.0.0

# Source Configuration
sonar.sources=app,config,database,resources,routes
sonar.exclusions=**/vendor/**,**/node_modules/**,**/storage/**,**/bootstrap/cache/**,**/public/build/**,**/public/hot,**/public/letters/**
sonar.tests=development/tests
sonar.test.exclusions=**/vendor/**,**/node_modules/**

# Language Configuration
sonar.php.version=8.1
sonar.php.coverage.reportPaths=coverage-clover.xml
sonar.php.tests.reportPath=tests-junit.xml
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Code Analysis Configuration - Exclude migrations and generated files
sonar.php.exclusions=**/migrations/**,**/seeders/**,**/*.blade.php
sonar.coverage.exclusions=**/config/**,**/database/migrations/**,**/database/seeders/**,**/tests/**,**/development/tests/**

# Encoding
sonar.sourceEncoding=UTF-8

# Quality Gate Configuration
sonar.qualitygate.wait=true

# Analysis Settings
sonar.scm.provider=git
sonar.scm.disabled=false
