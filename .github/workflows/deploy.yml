name: CREAMS CI/CD Pipeline

on:
  push:
    branches:
      - main      # Deploy to production
      - staging   # Deploy to staging
      - dev       # Deploy to development

env:
  SSH_USER: ec2-user
  SERVER_IP: ${{ secrets.LIGHTSAIL_IP }}

jobs:
  # ============================================
  # JOB 1: Run Tests
  # ============================================
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: creams_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mbstring, pdo_mysql, bcmath, xml, curl, zip, gd
          coverage: xdebug

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-suggest

      - name: Copy environment file
        run: cp .env.example .env

      - name: Generate application key
        run: php artisan key:generate

      - name: Run migrations
        run: php artisan migrate --force
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: creams_test
          DB_USERNAME: root
          DB_PASSWORD: password

      - name: Run tests
        run: php artisan test
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: creams_test
          DB_USERNAME: root
          DB_PASSWORD: password

  # ============================================
  # JOB 2: Deploy to Development
  # ============================================
  deploy-dev:
    name: Deploy to Development
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/dev'
    environment: development

    steps:
      - name: Deploy to dev server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.LIGHTSAIL_IP }}
          username: ec2-user
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /var/www/creams-dev

            # Pull latest changes
            git fetch origin dev
            git reset --hard origin/dev

            # Install dependencies
            composer install --no-dev --optimize-autoloader
            npm ci && npm run build

            # Run migrations
            php artisan migrate --force

            # Clear and rebuild caches
            php artisan config:clear
            php artisan route:clear
            php artisan view:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            # Restart PHP-FPM
            sudo systemctl reload php-fpm

            echo "✅ Development deployment complete!"

  # ============================================
  # JOB 3: Deploy to Staging
  # ============================================
  deploy-staging:
    name: Deploy to Staging
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/staging'
    environment: staging

    steps:
      - name: Deploy to staging server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.LIGHTSAIL_IP }}
          username: ec2-user
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /var/www/creams-staging

            # Pull latest changes
            git fetch origin staging
            git reset --hard origin/staging

            # Install dependencies
            composer install --no-dev --optimize-autoloader
            npm ci && npm run build

            # Run migrations
            php artisan migrate --force

            # Clear and rebuild caches
            php artisan config:clear
            php artisan route:clear
            php artisan view:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            # Restart PHP-FPM
            sudo systemctl reload php-fpm

            echo "✅ Staging deployment complete!"

  # ============================================
  # JOB 4: Deploy to Production
  # ============================================
  deploy-production:
    name: Deploy to Production
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: Deploy to production server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.LIGHTSAIL_IP }}
          username: ec2-user
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /var/www/creams-prod

            # Enable maintenance mode
            php artisan down --message="Deploying updates..." --retry=60

            # Pull latest changes
            git fetch origin main
            git reset --hard origin/main

            # Install dependencies
            composer install --no-dev --optimize-autoloader
            npm ci && npm run build

            # Run migrations
            php artisan migrate --force

            # Clear and rebuild caches
            php artisan config:clear
            php artisan route:clear
            php artisan view:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            # Restart PHP-FPM
            sudo systemctl reload php-fpm

            # Disable maintenance mode
            php artisan up

            echo "✅ Production deployment complete!"
