name: CREAMS Deploy

# Deployment is manual via SSH on Hostinger shared hosting.
# This workflow only runs tests on push to main and dev.
# To deploy: SSH to server and run git pull + php artisan cache commands.

on:
  push:
    branches:
      - main
      - dev

jobs:
  test:
    name: Run Tests Before Deploy
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: creams_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql, bcmath, xml, curl, zip, gd

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Copy environment file
        run: cp .env.example .env

      - name: Generate application key
        run: php artisan key:generate

      - name: Run migrations
        run: php artisan migrate --force
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: creams_test
          DB_USERNAME: root
          DB_PASSWORD: password

      - name: Run tests
        run: php artisan test
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: creams_test
          DB_USERNAME: root
          DB_PASSWORD: password

      - name: Remind to deploy manually
        if: success()
        run: |
          echo "Tests passed on branch ${{ github.ref_name }}"
          echo "To deploy to production: SSH to server, cd public_html, git pull origin main"
          echo "Then: php artisan config:cache && php artisan route:cache && php artisan view:cache"
