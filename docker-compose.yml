version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: creams-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
      - ./storage:/var/www/storage
    networks:
      - creams-network
    depends_on:
      - db

  nginx:
    image: nginx:alpine
    container_name: creams-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - creams-network
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: creams-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: cream
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_USER: ${DB_USERNAME:-creams}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "3306:3306"
    volumes:
      - creams-db-data:/var/lib/mysql
    networks:
      - creams-network

networks:
  creams-network:
    driver: bridge

volumes:
  creams-db-data:
    driver: local
