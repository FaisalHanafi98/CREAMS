# Nginx Configuration for faisalhanafi.com
# Handles both portfolio (/) and CREAMS (/creams/{demo_id}/)
#
# Copy to: /etc/nginx/conf.d/faisalhanafi.conf
# Test: sudo nginx -t
# Reload: sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name faisalhanafi.com www.faisalhanafi.com;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml;

    # ============================================
    # CREAMS Application: /creams/{demo_id}/*
    # ============================================

    # Static assets for CREAMS (CSS, JS, images, etc.)
    location ~ ^/creams/[a-zA-Z0-9_-]+/(css|js|images|build|storage|fonts|vendor)/(.*)$ {
        alias /var/www/creams/public/$1/$2;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Favicon and robots for CREAMS
    location ~ ^/creams/[a-zA-Z0-9_-]+/(favicon\.ico|robots\.txt)$ {
        alias /var/www/creams/public/$1;
        access_log off;
        log_not_found off;
    }

    # Main CREAMS application handler
    location ~ ^/creams/([a-zA-Z0-9_-]+)(/.*)?$ {
        # Set variables
        set $demo_id $1;
        set $request_path $2;

        # Default to / if no path
        if ($request_path = '') {
            set $request_path '/';
        }

        # Root for Laravel
        root /var/www/creams/public;
        index index.php;

        # Try files or pass to PHP
        try_files /nonexistent @creams_php;
    }

    # PHP handler for CREAMS
    location @creams_php {
        root /var/www/creams/public;

        fastcgi_pass unix:/run/php-fpm/www.sock;
        fastcgi_index index.php;

        # Pass the original URI to Laravel
        fastcgi_param SCRIPT_FILENAME /var/www/creams/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param DOCUMENT_ROOT /var/www/creams/public;

        # Pass demo_id as a header (Laravel middleware will read from route)
        fastcgi_param HTTP_X_DEMO_ID $demo_id;

        include fastcgi_params;

        # Timeouts for long-running requests (PDF generation, etc.)
        fastcgi_read_timeout 300;
        fastcgi_send_timeout 300;
    }

    # ============================================
    # Portfolio: Root path (/)
    # ============================================
    location / {
        root /var/www/portfolio;
        index index.html index.htm;
        try_files $uri $uri/ =404;
    }

    # ============================================
    # Health Check
    # ============================================
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # ============================================
    # Security: Deny hidden files
    # ============================================
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Error pages
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /var/www/portfolio;
    }
}

